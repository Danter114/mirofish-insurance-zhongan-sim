<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>控制台 · 仿真推演</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <a class="brand" href="/" style="color:inherit">← 事件</a>
  <span class="brand" id="eid">…</span>
  <span id="jobbadge"></span>
  <span class="spacer"></span>
  <span class="sub" id="clock"></span>
  <a class="btn" id="link-report" href="#" hidden>看报告</a>
  <button id="btn-report">生成报告</button>
  <button id="btn-stop" class="danger" hidden>停止</button>
  <button id="btn-run" class="primary">开始 / 续跑</button>
</header>

<div class="wrap">
  <div id="notes"></div>
  <div class="grid2">

    <div>
      <section class="card">
        <h2>进度 <span id="pct" class="mono" style="float:right;text-transform:none;color:var(--fg)"></span></h2>
        <div id="bar"></div>
        <div id="cells" style="margin-bottom:12px"></div>
        <dl class="kv" id="prog"></dl>
      </section>

      <section class="card">
        <h2>预检 <button class="ghost" id="btn-precheck" style="float:right;padding:2px 10px;font-size:12px">复检</button></h2>
        <div id="precheck"><div class="empty">读一下…</div></div>
      </section>

      <section class="card">
        <h2>LLM 配置</h2>
        <p class="hint" style="margin:-6px 0 12px">
          引擎要连自己的大模型才能演。填在事件配置里，或者给一份 <code>.env</code> 的路径。
          <b>已存的钥匙不会回显</b>，这里只显示填没填。
        </p>
        <div id="llmstate"></div>
        <label class="f"><span>base_url</span>
          <input type="text" id="l-base" placeholder="https://api.example.com/v1" autocomplete="off"></label>
        <label class="f"><span>model_name</span>
          <input type="text" id="l-model" placeholder="例如 claude-sonnet-5-5" autocomplete="off"></label>
        <label class="f"><span>api_key</span>
          <input type="password" id="l-key" placeholder="留空 = 不改动" autocomplete="new-password"></label>
        <label class="f"><span>或 .env 路径</span>
          <input type="text" id="l-env" placeholder="D:\...\mirofish-sim\.env" autocomplete="off"></label>
        <div class="row">
          <label class="row" style="gap:5px;font-size:12.5px;color:var(--dim)">
            <input type="checkbox" id="l-clear" style="width:auto"> 清空已存的钥匙
          </label>
          <span class="spacer" style="flex:1"></span>
          <button class="primary" id="btn-save-llm">保存</button>
        </div>
      </section>
    </div>

    <div>
      <section class="card">
        <h2>事件</h2>
        <dl class="kv" id="cfg"></dl>
      </section>

      <section class="card">
        <h2>运行日志 <span class="sub mono" id="logsrc" style="float:right;text-transform:none"></span></h2>
        <pre class="log" id="log">（还没跑过，或日志为空）</pre>
      </section>
    </div>

  </div>
</div>

<script type="module">
import { api, el, mount, jobBadge, bar, cells, fmtBytes, fmtDuration, since,
         paintLog, queryEventId, note, $ } from '/app.js';

const EID = queryEventId();
if (!EID) location.replace('/');
const enc = encodeURIComponent(EID);
const notes = $('#notes');
document.title = EID + ' · 控制台';
$('#eid').textContent = EID;
let lastState = null;

/* ── 取全量详情（配置 / 预检 / 盘点） ────────────────────── */
async function detail() {
  try {
    const d = await api('/api/events/' + enc);
    renderCfg(d.config);
    renderPrecheck(d.precheck);
    renderLlm(d.config.llm);
    renderInv(d.inventory, d.job);
  } catch (e) {
    note(notes, 'err', e.message);
  }
}

function renderCfg(c) {
  mount('#cfg',
    dt('事件 ID', c.event_id),
    dt('t0 时间', c.t0_time),
    dt('事件类型', c.event_type || '—'),
    dt('轮次', `${c.n_rounds} 轮 × ${c.round_hours} 小时`),
    dt('运行目录', el('span', { class: 'mono', text: c.run_dir })),
    dt('画像文件', el('span', { class: 'mono', text: c.persona_file })),
    dt('配置文件', el('span', { class: 'mono', text: c.config_path })));
}

const dt = (k, v) => [el('dt', { text: k }), el('dd', {}, v)];

function renderInv(inv, job) {
  const done = inv.rounds_done, exec = inv.rounds_executed;
  const running = job && job.state === 'running';
  mount('#bar', bar(done, exec, inv.complete));
  mount('#cells', cells(done, inv.rounds_total, running));
  $('#pct').textContent = inv.complete ? '已跑满' : `${inv.percent}%`;
  mount('#prog',
    dt('轮次', `${done} / ${exec} 轮（第 0 轮是输入，不用跑）`),
    dt('记录员', `${inv.recorder_lines} / ${inv.recorder_expected} 行`),
    dt('t0 快照', inv.t0_ready ? '有' : '缺'),
    dt('报告', inv.report_exists ? `${fmtBytes(inv.report_bytes)}` : '还没生成'),
    ...(job && job.started_at ? [
      dt('本次任务', (job.label || '') + ' · ' + job.state),
      dt('起于', job.started_at),
      dt('已跑', job.ended_at ? fmtDuration(since(job.started_at, job.ended_at))
                             : fmtDuration(since(job.started_at, new Date().toLocaleString('sv-SE')))),
    ] : []),
    ...(job && job.error ? [dt('说明', el('span', { style: 'color:var(--err)', text: job.error }))] : []));
  $('#jobbadge').replaceChildren(jobBadge(job));
  $('#btn-stop').hidden = !running;
  $('#btn-run').disabled = running;
  const link = $('#link-report');
  link.hidden = !inv.report_exists;
  link.href = '/report?event=' + enc;
}

function renderPrecheck(rep) {
  if (!rep.items.length) {
    mount('#precheck', el('div', { class: 'empty', text: '没有问题。' }));
    return;
  }
  mount('#precheck',
    el('div', { class: 'note ' + (rep.ok ? (rep.counts.warn ? '' : 'ok') : 'err'), style: 'margin-bottom:10px' },
      rep.ok ? (rep.counts.warn ? `可以跑，但有 ${rep.counts.warn} 条提醒。` : '全部通过，可以跑。')
             : `有 ${rep.counts.error} 条挡住了，修完才能跑。`),
    rep.items.map(i => el('div', { class: 'chk ' + i.level[0] },
      el('span', { class: 'ico', text: i.level === 'error' ? '✕' : i.level === 'warn' ? '!' : '·' }),
      el('div', { class: 't' },
        el('b', { text: i.title }),
        i.detail ? el('small', { text: i.detail }) : null))));
}

/* ── LLM 表单 ─────────────────────────────────────────────── */
function renderLlm(llm) {
  mount('#llmstate', el('div', { class: 'row', style: 'margin-bottom:12px' },
    flag('base_url', llm.base_url_set),
    flag('api_key', llm.api_key_set),
    flag('model_name', llm.model_name_set),
    llm.env_path ? flag('.env', llm.env_exists, llm.env_path) : null));
  if (document.activeElement !== $('#l-base')) $('#l-base').placeholder = llm.base_url_set ? '已填（不回显，重填即覆盖）' : 'https://api.example.com/v1';
  if (document.activeElement !== $('#l-model')) $('#l-model').placeholder = llm.model_name_set ? '已填（不回显，重填即覆盖）' : '例如 claude-sonnet-5-5';
  if (document.activeElement !== $('#l-key')) $('#l-key').placeholder = llm.api_key_set ? '已存了一把钥匙 · 留空 = 不改动' : '还没填';
  if (document.activeElement !== $('#l-env')) $('#l-env').value = llm.env_path || '';
}

const flag = (name, set, extra) =>
  el('span', { class: 'badge ' + (set ? 'ok' : '') , title: extra || '' }, `${name} ${set ? '已填' : '未填'}`);

$('#btn-save-llm').onclick = async () => {
  const body = {
    base_url: $('#l-base').value.trim(),
    model_name: $('#l-model').value.trim(),
    api_key: $('#l-key').value,
    env_path: $('#l-env').value.trim(),
    clear_api_key: $('#l-clear').checked,
  };
  try {
    await api(`/api/events/${enc}/llm`, { method: 'POST', body });
    $('#l-key').value = ''; $('#l-clear').checked = false;
    note(notes, 'ok', '存好了。');
    await detail();
  } catch (e) { note(notes, 'err', e.message); }
};

/* ── 按钮 ─────────────────────────────────────────────────── */
$('#btn-run').onclick = async () => {
  try {
    const d = await api(`/api/events/${enc}/run`, { method: 'POST', body: {} });
    note(notes, 'ok', `已启动（pid ${d.pid}）。它是自愈循环，跑到没得跑会自己停。`);
    await poll();
  } catch (e) { note(notes, 'err', e.message); }
};

$('#btn-stop').onclick = async () => {
  if (!confirm('停掉 ' + EID + ' 正在跑的任务？\n已跑完的轮次留在盘上不会丢，下次「开始 / 续跑」会接着跑。')) return;
  try {
    await api(`/api/events/${enc}/stop`, { method: 'POST', body: {} });
    note(notes, '', '已停止。');
    await poll();
  } catch (e) { note(notes, 'err', e.message); }
};

$('#btn-precheck').onclick = () => detail();

$('#btn-report').onclick = async () => {
  try {
    await api(`/api/events/${enc}/report`, { method: 'POST', body: {} });
    note(notes, 'ok', '报告生成已启动，看右边日志 —— 它要跑 extract → alert → build 三步。');
    await poll();
  } catch (e) { note(notes, 'err', e.message); }
};

/* ── 轮询：2 秒一次，只看状态 + 日志尾 ───────────────────── */
async function poll() {
  try {
    const d = await api(`/api/events/${enc}/status?tail=300`);
    renderInv(d.inventory, d.job);
    $('#logsrc').textContent = d.job.log ? d.job.log.split(/[\\/]/).pop() : '';
    if (d.log_tail && d.log_tail.length) paintLog($('#log'), d.log_tail);
    // 任务从「跑着」变成别的 → 重取一次全量（预检/报告大小都变了）
    if (lastState === 'running' && d.job.state !== 'running') {
      note(notes, d.job.state === 'done' ? 'ok' : 'err',
        d.job.state === 'done' ? '任务结束。' : ('任务结束：' + (d.job.error || d.job.state)));
      await detail();
    }
    lastState = d.job.state;
  } catch (e) { /* 轮询失败不吵用户，下一次会自己好 */ }
}

setInterval(() => {
  $('#clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
}, 1000);
detail().then(() => { poll(); setInterval(poll, 2000); });
</script>
</body>
</html>
