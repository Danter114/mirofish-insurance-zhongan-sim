<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>风控盾 · 深度互动</title>
<!-- ★ 这里用的是**相对**路径（不是 /step5.js 那种绝对路径）：
     同一份文件既被后端挂在 /demo/step5/，也要能直接双击用 file:// 打开。
     绝对路径只有前者能开 —— 而后端没起时，双击这条路是 demo 唯一的活路。

     ★ 页面自己的 js/css 就放在**同一层**（`./step5.js`，不是 `../step5.js`）：
     这样"每一页 url 以斜杠结尾"这条规则一立住，`./` 永远指自己这一页。

     ★ 目录叫 step5 而不是 step4，是**跟着工作流步骤号走的**（05 深度互动）：
     第 04 步「报告生成」的内容目前还住在 step3 那一页里（进度跑满后报告就铺开），
     将来真要单独拆一页出来，它落在 step4/ 就行，这一页不用改名字。 -->

<!-- 页签图标：内联的 data: URI，**不是外链**（PRD 要求离线可跑、不依赖公网）。
     这一行在每个 .html 壳里必须一模一样；不带它浏览器每开一页都去要一次
     /favicon.ico，然后 404。 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='rgb(24,144,255)' d='M12 2 4 5v6.2c0 4.8 3.3 9.1 8 10.8 4.7-1.7 8-6 8-10.8V5z'/></svg>">

<link rel="stylesheet" href="./step5.css">
</head>
<body>
<div id="app"></div>
<script src="./step5.js" defer></script>

<!-- ★ 纯静态托管（GitHub Pages）下没有后端：报告 iframe 会去请求 /api/events/…/report 拿到 404。
     这里探一次 /api/health，连不上就把那个 iframe 换成随包烘好的报告副本
     —— 内容与接口直出的一致，只是不走 HTTP。后端在的时候这段什么也不做。 -->
<script>
(function () {
  var REPORT = new URL('../step3/report.html', location.href).href;
  function swap() {
    var fs = document.querySelectorAll('iframe');
    for (var i = 0; i < fs.length; i++) {
      var f = fs[i], s = f.getAttribute('src') || '';
      if (f.__staticSwapped) continue;
      if (s.indexOf('/api/events/') === 0 || s.indexOf(location.origin + '/api/events/') === 0) {
        f.__staticSwapped = 1;
        f.src = REPORT;
      }
    }
  }
  function arm() {
    swap();
    new MutationObserver(swap).observe(document.documentElement, {childList: true, subtree: true});
  }
  fetch('/api/health', {cache: 'no-store'})
    .then(function (r) { if (!r.ok) arm(); })
    .catch(arm);
})();
</script>
</body>
</html>
