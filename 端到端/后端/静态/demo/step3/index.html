<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>风控盾 · 仿真推演</title>
<!-- ★ 这里用的是**相对**路径（不是 /step3.js 那种绝对路径）：
     同一份文件既被后端挂在 /demo/step3/，也要能直接双击用 file:// 打开。
     绝对路径只有前者能开 —— 而后端没起时，双击这条路是 demo 唯一的活路。

     ★ 页面自己的 js/css 就放在**同一层**（`./step3.js`，不是 `../step3.js`）：
     这样"每一页 url 以斜杠结尾"这条规则一立住，`./` 永远指自己这一页，
     五页可以无限往下加，谁也不用改谁。

     ★ 本目录里另外两个文件（`report.html` / `echarts.min.js`）**不在这里引**：
     报告是阶段二由 iframe 按 `./report.html` 加载的 —— 页面壳只管自己。
     report.html 由构建从「事件\EVT-001\」拷来，只把里面那一行 ECharts
     外链换成本层的 `./echarts.min.js`，其余逐位照抄。 -->

<!-- 页签图标：内联的 data: URI，**不是外链**（PRD 要求离线可跑、不依赖公网）。
     这一行在每个 .html 壳里必须一模一样；不带它浏览器每开一页都去要一次
     /favicon.ico，然后 404。 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='rgb(24,144,255)' d='M12 2 4 5v6.2c0 4.8 3.3 9.1 8 10.8 4.7-1.7 8-6 8-10.8V5z'/></svg>">

<link rel="stylesheet" href="./step3.css">
</head>
<body>
<div id="app"></div>
<script src="./step3.js" defer></script>
<!-- ★ 返回首页：Pages 上回到六卡落地页；本地起后端时回到 demo 总览。
     路径在运行期算：Pages 的地址形如 /<仓库名>/端到端/后端/静态/demo/xxx/，
     本地是 /demo/xxx/ —— 两种都认。location.pathname 是百分号编码的，先 decode。 -->
<a id="__home" href="/demo/" style="position:fixed;left:14px;bottom:12px;z-index:9000;font:12px/1.6 ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif;color:#4b5563;background:#f9fafb;border:1px solid #4b556333;border-radius:999px;padding:5px 12px;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.06)">← 首页</a>
<script>
(function () {
  var a = document.getElementById('__home');
  var p = decodeURIComponent(location.pathname);
  var m = p.match(/^(.*?)\/端到端\/后端\/静态\/demo\//);
  a.href = m ? m[1] + '/' : '/demo/';
})();
</script>
</body>
</html>
