<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>报告 · 仿真推演</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <a class="brand" href="/" style="color:inherit">← 事件</a>
  <span class="brand" id="eid">…</span>
  <span class="sub" id="meta"></span>
  <span class="spacer"></span>
  <button class="ghost" id="btn-reload">重新载入</button>
  <a class="btn" id="btn-open" href="#" target="_blank" rel="noopener">新窗口打开</a>
</header>

<iframe class="report" id="frame" title="仿真推演报告"></iframe>

<script type="module">
import { api, queryEventId, $ } from '/app.js';

const EID = queryEventId();
if (!EID) location.replace('/');
const enc = encodeURIComponent(EID);
document.title = EID + ' · 报告';
$('#eid').textContent = EID;
$('#btn-open').href = '/api/events/' + enc + '/report';

function load() {
  // 带时间戳破缓存：报告每次重新生成内容都变，浏览器不能拿旧的
  $('#frame').src = '/api/events/' + enc + '/report?t=' + Date.now();
}

api('/api/events/' + enc)
  .then((d) => {
    const i = d.inventory;
    $('#meta').textContent = i.report_exists
      ? `${i.rounds_done}/${i.rounds_executed} 轮 · ${(i.report_bytes / 1024).toFixed(0)} KB`
      : '还没有报告';
    load();
  })
  .catch(() => load());

$('#btn-reload').onclick = load;
</script>
</body>
</html>
