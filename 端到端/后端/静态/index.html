<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仿真推演控制台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <span class="brand">仿真推演控制台</span>
  <span class="sub" id="health">连接中…</span>
  <span class="spacer"></span>
  <span class="sub" id="clock"></span>
  <button class="ghost" id="btn-refresh">刷新</button>
  <button class="primary" id="btn-new">＋ 新建事件</button>
</header>

<div class="wrap">
  <div id="notes"></div>

  <!-- 新建事件 -->
  <section class="card" id="newpanel" hidden>
    <h2>新建事件</h2>
    <p class="hint" style="margin-bottom:14px">
      这里只登记事件的身份与运行参数。<b>画像文件</b>、<b>t0 快照</b>要到
      <code>事件\&lt;id&gt;\</code> 里放齐，预检会告诉你还差什么。
    </p>
    <div class="grid2">
      <div>
        <label class="f"><span>事件 ID *</span>
          <input type="text" id="n-eid" placeholder="EVT-002" autocomplete="off">
          <div class="hint">字母 / 数字 / 下划线 / 短横 / 中文，≤64 字符。它会当目录名和报告文件名。</div>
        </label>
        <label class="f"><span>t0 时间 *</span>
          <input type="text" id="n-t0" placeholder="2026-05-22 22:00" autocomplete="off">
          <div class="hint">这轮仿真的第 0 轮时刻。格式 <code>YYYY-MM-DD HH:MM</code>。</div>
        </label>
        <label class="f"><span>事件标题</span>
          <input type="text" id="n-title" placeholder="（留空则用「&lt;ID&gt; 仿真推演报告」）" autocomplete="off">
        </label>
        <label class="f"><span>事件类型</span>
          <input type="text" id="n-type" placeholder="例如：品牌低俗营销引发次生信任危机" autocomplete="off">
          <div class="hint">写进报告模块五的定性，也用于报告层措辞。</div>
        </label>
      </div>
      <div>
        <label class="f"><span>事件背景 *</span>
          <textarea id="n-brief" rows="6" placeholder="这段文字会原样作为【事件背景】进提示词，模型据此判断该不该发声、说什么。"></textarea>
          <div class="hint">必填。写清「谁、在哪个平台、因为什么被议论」，不要写结论。</div>
        </label>
        <div class="grid2" style="gap:12px">
          <label class="f"><span>总轮数</span>
            <input type="number" id="n-rounds" value="42" min="2" max="500">
          </label>
          <label class="f"><span>单轮时长（小时）</span>
            <input type="number" id="n-hours" value="4" min="1" max="24">
          </label>
        </div>
        <div class="hint" style="margin:-4px 0 12px">
          每轮 4 小时 × 42 轮 = 覆盖 7 天。<b>总轮数</b>是含第 0 轮在内的格数，实际调模型的只有后 41 轮。
        </div>
        <div class="row" style="justify-content:flex-end">
          <button class="ghost" id="btn-cancel">取消</button>
          <button class="primary" id="btn-create">创建</button>
        </div>
      </div>
    </div>
  </section>

  <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:0 0 12px">
    已有事件
  </h2>
  <div class="grid3" id="list"><div class="empty">读取中…</div></div>
</div>

<script type="module">
import { api, el, mount, badge, jobBadge, bar, fmtBytes, note, $ } from '/app.js';

const notes = $('#notes');
let busy = false;

async function load() {
  try {
    const h = await api('/api/health');
    $('#health').textContent = `已连接 · 根目录 ${h.root} · Python ${h.python}`;
  } catch (e) {
    $('#health').textContent = '连接不上后端：' + e.message;
  }
  try {
    const { events } = await api('/api/events');
    render(events);
  } catch (e) {
    mount('#list', el('div', { class: 'empty', text: '取事件列表失败：' + e.message }));
  }
}

function render(events) {
  if (!events.length) {
    mount('#list', el('div', { class: 'empty', text: '还没有事件。点右上角「＋ 新建事件」起一个。' }));
    return;
  }
  mount('#list', events.map(card));
}

function card(ev) {
  if (ev.broken) {
    return el('div', { class: 'card ecard' },
      el('div', { class: 'hd' }, el('b', { text: ev.event_id }), badge('err', '配置读不出来')),
      el('div', { class: 'brief mono', text: (ev.error || '').split('\n')[0] }));
  }
  const done = ev.rounds_done, exec = ev.rounds_executed;
  const running = ev.job && ev.job.state === 'running';
  const pct = exec > 0 ? ((done / exec) * 100).toFixed(0) : '0';

  const acts = el('div', { class: 'row' },
    el('a', { class: 'btn', href: '/run?event=' + encodeURIComponent(ev.event_id) }, '打开控制台'),
    ev.report_exists
      ? el('a', { class: 'btn', href: '/report?event=' + encodeURIComponent(ev.event_id) }, '看报告')
      : null,
    el('span', { class: 'spacer', style: 'flex:1' }),
    ev.rounds_done >= 1
      ? el('button', { onclick: () => genReport(ev.event_id) }, '生成报告')
      : null);

  return el('div', { class: 'card ecard' },
    el('div', { class: 'hd' },
      el('b', { text: ev.event_id }),
      ev.event_type ? badge('', ev.event_type) : null),
    el('div', { class: 't0', text: 't0 = ' + ev.t0_time + ' · ' + ev.round_hours + 'h/轮' }),
    el('div', { class: 'brief', text: ev.event_brief || '（没写事件背景）' }),
    el('div', {},
      el('div', { class: 'row', style: 'justify-content:space-between;font-size:12.5px;color:var(--dim);margin-bottom:6px' },
        el('span', { text: `轮 ${done}/${exec}（${pct}%）` }),
        el('span', { text: ev.complete ? '已跑满' : (running ? '跑着' : '没跑满') })),
      bar(done, exec, ev.complete)),
    el('div', { class: 'meta' },
      `记录员 ${ev.recorder_lines}/${ev.recorder_expected} 行 · ` +
      (ev.report_exists ? `报告 ${fmtBytes(ev.report_bytes)}` : '还没报告')),
    el('div', { class: 'row', style: 'justify-content:space-between' },
      jobBadge(ev.job), acts));
}

async function genReport(eid) {
  if (busy) return;
  busy = true;
  try {
    await api(`/api/events/${encodeURIComponent(eid)}/report`, { method: 'POST', body: {} });
    note(notes, 'ok', `${eid}：报告生成已启动，去控制台看进度。`);
  } catch (e) {
    note(notes, 'err', `${eid}：${e.message}`);
  } finally { busy = false; }
}

/* ── 新建事件 ─────────────────────────────────────────────── */
$('#btn-new').onclick = () => { $('#newpanel').hidden = false; $('#n-eid').focus(); };
$('#btn-cancel').onclick = () => { $('#newpanel').hidden = true; };

$('#btn-create').onclick = async () => {
  const body = {
    event_id: $('#n-eid').value.trim(),
    event_brief: $('#n-brief').value.trim(),
    t0_time: $('#n-t0').value.trim(),
    report_title: $('#n-title').value.trim(),
    event_type: $('#n-type').value.trim(),
    n_rounds: +$('#n-rounds').value || 42,
    round_hours: +$('#n-hours').value || 4,
  };
  try {
    const r = await api('/api/events', { method: 'POST', body });
    const pc = r.precheck;
    $('#newpanel').hidden = true;
    ['#n-eid', '#n-brief', '#n-t0', '#n-title', '#n-type'].forEach(s => { $(s).value = ''; });
    if (pc.ok) {
      note(notes, pc.counts.warn ? '' : 'ok',
        `${r.event_id} 建好了。${pc.counts.warn ? '有 ' + pc.counts.warn + ' 条提醒，' : ''}去控制台放画像和 t0 快照。`);
    } else {
      note(notes, 'err', `${r.event_id} 建好了，但预检有 ${pc.counts.error} 条要修：` +
        pc.items.filter(i => i.level === 'error').map(i => i.title).join('；'));
    }
    await load();
  } catch (e) {
    note(notes, 'err', e.message);
  }
};

$('#btn-refresh').onclick = load;
setInterval(() => {
  $('#clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
}, 1000);
setInterval(load, 5000);
load();
</script>
</body>
</html>
